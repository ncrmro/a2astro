version: 1
id: agent-chat
title: Chat with a resident agent
description: >-
  An operator talks to a resident agent through the A2A task plane. Each turn is
  one Task inside a shared contextId; the reply is the Task's status message.
status: implemented

actors:
  operator: {kind: human}
  a2astro: {kind: system}
  resident-agent: {kind: agent, profile: engineer}

environments:
  browser: browser
  a2astro: node-ssr
  kubernetes: agent-operator

integrations:
  a2a-http: {kind: protocol, label: A2A v1 HTTP+JSON, server: channels}
  channels: {kind: extension, label: Channels, repository: ai-outfitter/channels}

nodes:
  - id: compose
    action: compose-message
    description: Write the message on /agents/:id/chat, in a new or existing conversation.
    actor: operator
    environment: browser
  - id: send
    action: post-message-send
    description: >-
      POST /message:send with returnImmediately, the outfitter-task/v1 extension,
      and a2astro/v1 chat metadata. The bearer token never leaves the server.
    actor: a2astro
    environment: a2astro
    needs: [compose]
    uses: [a2a-http]
  - id: accept
    action: mint-task
    description: Channels commits the activation and returns the Task that carries this turn.
    actor: resident-agent
    environment: kubernetes
    needs: [send]
    uses: [channels]
  - id: turn
    action: run-agent-turn
    description: The agent wakes, runs one turn, and publishes status and artifacts.
    actor: resident-agent
    environment: kubernetes
    needs: [accept]
    uses: [channels]
  - id: stream
    action: subscribe-task
    description: >-
      a2astro proxies GET /tasks/{id}:subscribe as SSE so the page updates while
      the turn runs.
    actor: a2astro
    environment: a2astro
    needs: [accept]
    uses: [a2a-http]
  - id: read
    action: read-reply
    description: The operator reads the reply; a follow-up reuses the same contextId.
    actor: operator
    environment: browser
    needs: [turn, stream]

feedback:
  - {from: read, to: compose}
