# Source-build Deployment: run a2astro in-cluster without a private registry.
#
# `deploy/a2astro.yaml` runs the published image, which is the shape to keep.
# Until that package is public, this variant reaches the same running state from
# a public base image and a public clone: an init container fetches the pinned
# commit, installs, and builds into a shared emptyDir, and the server runs it.
#
# Apply it after deploy/a2astro.yaml — same name, so it replaces that Deployment:
#
#   kubectl apply -f deploy/a2astro.yaml -f deploy/source-build.yaml
#
# Trade-offs, deliberately: the build runs on every pod start (~1 min, needs
# egress to github.com and registry.npmjs.org) and the revision is pinned here
# rather than by an image digest. Move back to deploy/a2astro.yaml once the
# image can be pulled.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: a2astro
  namespace: a2astro
  labels:
    app.kubernetes.io/name: a2astro
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: a2astro
  template:
    metadata:
      labels:
        app.kubernetes.io/name: a2astro
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: build
          image: docker.io/library/node:22
          workingDir: /app
          command: [sh, -ceu]
          args:
            - |
              # The emptyDir is fsGroup-owned, so git refuses it as "dubious
              # ownership" until told otherwise. HOME must be writable for
              # git config to land at all.
              export HOME=/app
              git config --global --add safe.directory /app
              git init -q .
              git remote add origin https://github.com/ncrmro/a2astro.git
              git fetch -q --depth 1 origin "$REVISION"
              git checkout -q FETCH_HEAD
              npm ci --no-audit --no-fund
              npm run build
              echo "built $REVISION"
          env:
            - name: REVISION
              value: main
            - name: npm_config_cache
              value: /app/.npm
          volumeMounts:
            - name: app
              mountPath: /app
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      containers:
        - name: a2astro
          image: docker.io/library/node:22
          workingDir: /app
          # Git stays on PATH: catalogs are fetched at runtime from their pin.
          command: [sh, -ceu]
          args:
            - |
              exec node ./dist/server/entry.mjs
          ports:
            - name: http
              containerPort: 4321
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "4321"
            - name: NODE_ENV
              value: production
            - name: A2ASTRO_CONFIG
              value: /etc/a2astro/a2astro.config.yaml
            - name: TZ
              value: America/Chicago
          envFrom:
            - secretRef:
                name: a2astro-agent-tokens
                optional: true
          volumeMounts:
            - name: app
              mountPath: /app
            - name: config
              mountPath: /etc/a2astro
              readOnly: true
            - name: data
              mountPath: /var/lib/a2astro
          readinessProbe:
            httpGet: {path: /workflows, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /workflows, port: http}
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: app
          emptyDir: {}
        - name: config
          secret:
            secretName: a2astro-config
        - name: data
          persistentVolumeClaim:
            claimName: a2astro-data
