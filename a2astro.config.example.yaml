# Copy to a2astro.config.yaml (git-ignored) or point A2ASTRO_CONFIG at another file.
# Resident agents deployed by ai-outfitter/agent-operator expose the A2A task
# plane from the Channels extension when A2A_SERVER=1 is set on the pod.
dataDir: ./data
catalogs:
  # Workflows come from the catalog the agents themselves resolve. Pin it the way
  # an Organization's agentCatalogs entry does — a2astro fetches the revision once
  # into <dataDir>/catalogs and never refetches it.
  - uri: https://github.com/ai-outfitter/community-profiles.git
    revision: v1.7.0
  # An organization catalog that pins its own workflows works the same way:
  # - uri: git+http://host-forgejo.default.svc.cluster.local:3001/ks.systems/.agents.git
  #   revision: 21aeac421d5d80b7579734001540f261925e3832
  # A local checkout is the development shortcut.
  # - ~/repos/ai-outfitter/community-profiles
agents:
  - id: vega
    name: Vega
    description: Resident engineer on the ocean cluster.
    workflow: engineer
    a2a:
      url: https://vega.ncrmro.com:8788
      token: ${A2ASTRO_VEGA_TOKEN}
    deployment:
      cluster: ocean
      namespace: agent-vega
  - id: luce
    name: Luce
    workflow: issue-triage
    a2a:
      url: https://luce.ncrmro.com:8788
      token: ${A2ASTRO_LUCE_TOKEN}
    deployment:
      cluster: ocean
      namespace: agent-luce
